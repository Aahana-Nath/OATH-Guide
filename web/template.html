<title>OAuth Setup Guides</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* Layout: a lookup-and-library rail beside one long guide, every fact carrying its evidence label. */
:root {
  --font-sans: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, monospace;

  --bg: #F4F5F7;
  --surface: #FFFFFF;
  --surface-2: #EEF0F3;
  --line: #DDE1E6;
  --line-strong: #B9C0CA;
  --fg: #15181D;
  --muted: #4A505A;
  --accent: #1D4FB8;
  --accent-fg: #FFFFFF;
  --focus: #1D4FB8;

  --tested-bg: #E2F2E7;   --tested-fg: #165F31;   --tested-solid: #2E8B57;
  --official-bg: #E4ECFB; --official-fg: #1D4596; --official-solid: #3C6FD1;
  --inferred-bg: #FBF0D9; --inferred-fg: #7A4F00; --inferred-solid: #C48A12;
  --unknown-bg: #ECEEF1;  --unknown-fg: #444A53;  --unknown-solid: #8C94A0;

  --easy-bg: #E2F2E7;   --easy-fg: #165F31;
  --medium-bg: #FBF0D9; --medium-fg: #7A4F00;
  --hard-bg: #FBE4E1;   --hard-fg: #8A2A1E;
  --callout-bg: #FFF8E8; --callout-line: #E8D3A2;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0F1115; --surface: #171A20; --surface-2: #20242B; --line: #2A2F38; --line-strong: #444B57;
    --fg: #E8EAED; --muted: #A3AAB5; --accent: #8DB0F8; --accent-fg: #0F1115; --focus: #8DB0F8;
    --tested-bg: #16301F;   --tested-fg: #8FD3A4;   --tested-solid: #5DB57F;
    --official-bg: #17284A; --official-fg: #9DBBF5; --official-solid: #6C97EA;
    --inferred-bg: #3A2C0D; --inferred-fg: #E8C26B; --inferred-solid: #D9A22A;
    --unknown-bg: #262A31;  --unknown-fg: #B4BAC4;  --unknown-solid: #7D8591;
    --easy-bg: #16301F;   --easy-fg: #8FD3A4;
    --medium-bg: #3A2C0D; --medium-fg: #E8C26B;
    --hard-bg: #3B1714;   --hard-fg: #F0A79D;
    --callout-bg: #2A2310; --callout-line: #5A4A1F;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0F1115; --surface: #171A20; --surface-2: #20242B; --line: #2A2F38; --line-strong: #444B57;
  --fg: #E8EAED; --muted: #A3AAB5; --accent: #8DB0F8; --accent-fg: #0F1115; --focus: #8DB0F8;
  --tested-bg: #16301F;   --tested-fg: #8FD3A4;   --tested-solid: #5DB57F;
  --official-bg: #17284A; --official-fg: #9DBBF5; --official-solid: #6C97EA;
  --inferred-bg: #3A2C0D; --inferred-fg: #E8C26B; --inferred-solid: #D9A22A;
  --unknown-bg: #262A31;  --unknown-fg: #B4BAC4;  --unknown-solid: #7D8591;
  --easy-bg: #16301F;   --easy-fg: #8FD3A4;
  --medium-bg: #3A2C0D; --medium-fg: #E8C26B;
  --hard-bg: #3B1714;   --hard-fg: #F0A79D;
  --callout-bg: #2A2310; --callout-line: #5A4A1F;
  color-scheme: dark;
}

* { box-sizing: border-box; }
body { background: var(--bg); color: var(--fg); font-family: var(--font-sans); font-size: 15px; line-height: 1.5; margin: 0; }
a { color: var(--accent); }
h1, h2, h3, p { margin: 0; }
h1, h2, h3 { text-wrap: balance; }
button, input { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
.mono { font-family: var(--font-mono); font-size: 0.92em; }

.bar { background: var(--surface); border-bottom: 1px solid var(--line); }
.wrap { max-width: 1360px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.bar .wrap { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px; padding-block: 14px; }
.brand { display: flex; align-items: center; gap: 10px; font-weight: 600; font-size: 16px; }
.brand-mark { width: 28px; height: 28px; border-radius: 6px; background: var(--fg); display: grid; place-items: center; }
.brand-mark svg { stroke: var(--bg); }
.bar nav { color: var(--muted); font-size: 14px; }

.layout { display: grid; grid-template-columns: minmax(0, 360px) minmax(0, 1fr); gap: 24px; align-items: start; padding-block: 24px 40px; }
.rail { display: flex; flex-direction: column; gap: 16px; }
.main { display: flex; flex-direction: column; gap: 20px; }
@media (max-width: 920px) { .layout { grid-template-columns: minmax(0, 1fr); } }

.card { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 20px; display: flex; flex-direction: column; gap: 12px; min-width: 0; }
.card.pad-lg { padding: 24px; }
.eyebrow { font-size: 12px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: var(--muted); }
.h2 { font-size: 18px; font-weight: 700; }
.sub { color: var(--muted); font-size: 14px; }

label.lbl { font-size: 13px; font-weight: 600; color: var(--muted); }
.field { font-family: var(--font-mono); font-size: 15px; padding: 12px 14px; border: 1px solid var(--line-strong); border-radius: 8px; background: var(--surface); width: 100%; min-height: 44px; }
.btn { font-weight: 600; min-height: 44px; padding: 10px 16px; border-radius: 8px; border: 1px solid var(--line-strong); background: var(--surface); cursor: pointer; }
.btn.primary { background: var(--accent); color: var(--accent-fg); border-color: var(--accent); }
.btn.small { min-height: 36px; padding: 6px 12px; font-size: 14px; }
.note { font-size: 14px; color: var(--muted); }
.note.warn { background: var(--callout-bg); border: 1px solid var(--callout-line); border-radius: 8px; padding: 10px 12px; color: var(--fg); }

.lib { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px; }
.lib a { display: flex; flex-direction: column; gap: 6px; padding: 12px; border: 1px solid var(--line); border-radius: 8px; text-decoration: none; color: var(--fg); min-height: 44px; }
.lib a[aria-current="page"] { border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); }
.lib .nm { font-weight: 600; }

.chip { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 600; padding: 3px 9px; border-radius: 999px; white-space: nowrap; }
.chip.easy { background: var(--easy-bg); color: var(--easy-fg); }
.chip.medium { background: var(--medium-bg); color: var(--medium-fg); }
.chip.hard { background: var(--hard-bg); color: var(--hard-fg); }
.chip.unknown { background: var(--unknown-bg); color: var(--unknown-fg); }
.chip.status { background: transparent; border: 1px solid var(--line-strong); color: var(--fg); }
.chip.status.required { border-color: var(--fg); }
.chip.status.not_asked, .chip.status.optional, .chip.status.unknown { color: var(--muted); }
.chip.actor { background: var(--surface-2); color: var(--fg); }
.chip.actor.agent, .chip.actor.both { background: var(--official-bg); color: var(--official-fg); }
.chip.rec { background: var(--accent); color: var(--accent-fg); }
.row-chips { display: flex; flex-wrap: wrap; gap: 6px; }

.meter { display: flex; height: 10px; border-radius: 999px; overflow: hidden; background: var(--surface-2); }
.meter span { display: block; height: 100%; }
.meter .tested { background: var(--tested-solid); } .meter .official_docs { background: var(--official-solid); }
.meter .inferred { background: var(--inferred-solid); } .meter .unknown { background: var(--unknown-solid); }
.legend { display: flex; flex-direction: column; gap: 8px; margin: 0; padding: 0; list-style: none; font-size: 14px; }
.legend li { display: grid; grid-template-columns: auto 1fr auto; gap: 8px; align-items: baseline; }
.legend .sw { width: 10px; height: 10px; border-radius: 3px; display: inline-block; }
.legend .ct { font-variant-numeric: tabular-nums; font-weight: 600; }
.legend .hp { color: var(--muted); font-size: 13px; }

/* claims: pill is the details summary, body opens beneath it */
.fact { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.fact > .t { overflow-wrap: anywhere; }
details.claim { min-width: 0; }
details.claim > summary { list-style: none; cursor: pointer; display: inline-flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 600; padding: 3px 9px; border-radius: 999px; user-select: none; }
details.claim > summary::-webkit-details-marker { display: none; }
details.claim > summary::after { content: "+"; font-weight: 700; opacity: 0.7; }
details.claim[open] > summary::after { content: "–"; }
summary.tested { background: var(--tested-bg); color: var(--tested-fg); }
summary.official_docs { background: var(--official-bg); color: var(--official-fg); }
summary.inferred { background: var(--inferred-bg); color: var(--inferred-fg); }
summary.unknown { background: var(--unknown-bg); color: var(--unknown-fg); }
.cbody { margin-top: 8px; padding: 10px 12px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface-2); font-size: 13px; display: flex; flex-direction: column; gap: 6px; }
.cbody blockquote { margin: 0; padding-left: 10px; border-left: 2px solid var(--line-strong); font-family: var(--font-mono); font-size: 12.5px; overflow-wrap: anywhere; }
.cbody .meta { color: var(--muted); }
.cbody a { overflow-wrap: anywhere; }

.head { display: flex; flex-direction: column; gap: 14px; }
.head-top { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px; }
.head h1 { font-size: 30px; font-weight: 700; letter-spacing: -0.01em; }
.lead { font-size: 17px; max-width: 70ch; }
.diffs { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 12px; }
.diff { border: 1px solid var(--line); border-radius: 8px; padding: 12px; display: flex; flex-direction: column; gap: 8px; min-width: 0; }

.tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(230px, 1fr)); gap: 12px; }
.tile { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 16px; display: flex; flex-direction: column; gap: 8px; min-width: 0; }
.tile .big { font-size: 20px; font-weight: 700; line-height: 1.25; text-wrap: balance; }

.tabs { display: flex; flex-wrap: wrap; gap: 8px; }
.tab { min-height: 44px; padding: 8px 16px; border-radius: 8px; border: 1px solid var(--line-strong); background: var(--surface); cursor: pointer; font-weight: 600; display: inline-flex; align-items: center; gap: 8px; }
.tab[aria-selected="true"] { background: var(--fg); color: var(--bg); border-color: var(--fg); }

.scroll { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; font-size: 14px; }
th, td { text-align: left; vertical-align: top; padding: 10px; border-bottom: 1px solid var(--line); min-width: 0; }
th { font-weight: 600; color: var(--muted); font-size: 13px; }
tbody tr:last-child td, tbody tr:last-child th { border-bottom: 0; }
td.sel, th.sel { background: var(--surface-2); }
.cmp { min-width: 560px; }
.tbl { min-width: 520px; }

.callout { background: var(--callout-bg); border: 1px solid var(--callout-line); border-radius: 10px; padding: 16px 20px; display: flex; flex-direction: column; gap: 10px; }

.ladder { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 14px; }
.tier { display: grid; grid-template-columns: 32px minmax(0, 1fr); gap: 14px; }
.tier .n { width: 32px; height: 32px; border-radius: 50%; background: var(--fg); color: var(--bg); display: grid; place-items: center; font-weight: 700; font-size: 14px; }
.tier .body { display: flex; flex-direction: column; gap: 10px; padding-bottom: 14px; border-bottom: 1px solid var(--line); min-width: 0; }
.tier:last-child .body { border-bottom: 0; padding-bottom: 0; }
.kv { display: grid; grid-template-columns: 90px minmax(0, 1fr); gap: 4px 12px; font-size: 14px; }
.kv dt { color: var(--muted); } .kv dd { margin: 0; overflow-wrap: anywhere; }
.pre { margin: 0; padding-left: 18px; font-size: 14px; display: flex; flex-direction: column; gap: 4px; }

.steps { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 14px; }
.step { display: grid; grid-template-columns: 28px minmax(0, 1fr); gap: 12px; }
.step .n { width: 28px; height: 28px; border-radius: 50%; background: var(--fg); color: var(--bg); display: grid; place-items: center; font-size: 13px; font-weight: 700; }
.step .body { display: flex; flex-direction: column; gap: 6px; min-width: 0; }

.two { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 20px; }
.list { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 14px; font-size: 14px; }
.list li { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.list .rowtop { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; }

.filters { display: flex; flex-wrap: wrap; gap: 8px; }
.filters .tab { min-height: 36px; padding: 4px 12px; font-size: 14px; }
.dashed { border-style: dashed; border-color: var(--line-strong); }
.foot { color: var(--muted); font-size: 13px; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
@media (prefers-reduced-motion: reduce) { * { scroll-behavior: auto !important; transition: none !important; } }
</style>

<header class="bar">
  <div class="wrap">
    <div class="brand">
      <span class="brand-mark" aria-hidden="true"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="11" width="16" height="10" rx="2"></rect><path d="M8 11V7a4 4 0 0 1 8 0v4"></path></svg></span>
      <span>OAuth Setup Guides</span>
    </div>
    <nav>Every claim carries a label, a source and a date.</nav>
  </div>
</header>

<div class="wrap">
  <div class="layout">
    <aside class="rail" id="rail" aria-label="Lookup and library"></aside>
    <main class="main" id="guide" aria-live="polite"></main>
  </div>
</div>

<script>
/*__DATA__*/

const LABELS = { tested: "Tested", official_docs: "Official docs", inferred: "Inferred", unknown: "Unknown" };
const LABEL_HELP = {
  tested: "You did it and saw the result.",
  official_docs: "Stated in the provider's docs or portal.",
  inferred: "Reasoned from other facts; the basis is shown.",
  unknown: "Looked for and not found, or not checked."
};
const SOURCE_TYPES = { docs: "Provider docs", portal_text: "Provider portal text", manual_test: "Manual test", agent_probe: "Agent live probe", none: "No source" };
const LEVELS = { easy: "Easy", medium: "Medium", hard: "Hard", unknown: "Unknown" };
const STATUS = { required: "Required", optional: "Optional", not_asked: "Not asked", unknown: "Unknown" };
const ACTOR = { human: "You", agent: "Agent", both: "Both" };

const state = { key: null, type: null, filter: "all", showAll: false, query: "", message: "" };

const esc = (s) => String(s == null ? "" : s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const safeUrl = (u) => (/^https?:\/\//i.test(u || "") ? u : null);
const hostOf = (u) => { try { return new URL(u).host; } catch (e) { return u; } };
const $ = (id) => document.getElementById(id);

function claimPill(c) {
  if (!c) return "";
  const url = safeUrl(c.source_url);
  const parts = [];
  parts.push(`<div class="meta">${esc(SOURCE_TYPES[c.source_type] || "No source")}${url ? ` · <a href="${esc(url)}" target="_blank" rel="noopener">${esc(hostOf(url))}</a>` : ""} · checked ${esc(c.checked_at)}</div>`);
  if (c.evidence_quote) parts.push(`<blockquote>${esc(c.evidence_quote)}</blockquote>`);
  if (c.note) parts.push(`<div>${esc(c.note)}</div>`);
  return `<details class="claim"><summary class="${esc(c.label)}">${esc(LABELS[c.label])}</summary><div class="cbody">${parts.join("")}</div></details>`;
}
const fact = (text, claim) => `<div class="fact"><span class="t">${esc(text)}</span>${claimPill(claim)}</div>`;
const chipLevel = (lvl) => `<span class="chip ${esc(lvl)}">${esc(LEVELS[lvl])}</span>`;
const section = (title, inner, sub) => `<section class="card pad-lg"><h2 class="h2">${esc(title)}</h2>${sub ? `<p class="sub">${esc(sub)}</p>` : ""}${inner}</section>`;

function collectClaims(node, where, out) {
  if (Array.isArray(node)) { node.forEach((n) => collectClaims(n, where, out)); return; }
  if (node && typeof node === "object") {
    if (node.label && node.checked_at && node.text) { out.push({ where, claim: node }); return; }
    for (const k of Object.keys(node)) collectClaims(node[k], where || k, out);
  }
}
const SECTION_NAMES = { difficulty: "Difficulty", time: "Time", setup_types: "Setup types", creation_paths: "Creation paths", access_ladder: "Access ladder", requirements: "Requirements", limits: "Limits", blockers: "Blockers", steps: "Steps", agent_vs_human: "Agent vs you", extras: "Also worth knowing" };
function allClaims(g) {
  const out = [];
  for (const k of Object.keys(SECTION_NAMES)) if (g[k]) collectClaims(g[k], SECTION_NAMES[k], out);
  return out;
}

/* ---------- rail ---------- */
function renderRail() {
  const g = DATA[state.key];
  const claims = allClaims(g);
  const counts = { tested: 0, official_docs: 0, inferred: 0, unknown: 0 };
  claims.forEach((c) => counts[c.claim.label]++);
  const total = claims.length || 1;

  const lib = Object.keys(DATA).map((k) => {
    const d = DATA[k];
    return `<li><a href="#${esc(k)}" ${k === state.key ? 'aria-current="page"' : ""}>
      <span class="nm">${esc(d.provider.name)}</span>
      <span class="row-chips"><span class="chip ${esc(d.difficulty.start.level)}">Start: ${esc(LEVELS[d.difficulty.start.level])}</span><span class="chip ${esc(d.difficulty.public.level)}">Public: ${esc(LEVELS[d.difficulty.public.level])}</span></span>
    </a></li>`;
  }).join("");

  const meter = Object.keys(counts).map((k) => `<span class="${k}" style="width:${(counts[k] / total * 100).toFixed(2)}%" title="${esc(LABELS[k])}: ${counts[k]}"></span>`).join("");
  const legend = Object.keys(counts).map((k) => `<li><span class="sw" style="background:var(--${k === "official_docs" ? "official" : k}-solid)"></span><span><strong>${esc(LABELS[k])}</strong><br><span class="hp">${esc(LABEL_HELP[k])}</span></span><span class="ct">${counts[k]}</span></li>`).join("");

  const srcs = g.evidence.sources.map((s) => {
    const u = safeUrl(s.url);
    const kind = s.type === "docs" ? "Docs" : s.type === "portal" ? "Portal" : "Manual test";
    return `<li class="fact"><span class="t">${u ? `<a href="${esc(u)}" target="_blank" rel="noopener">${esc(s.title)}</a>` : esc(s.title)}</span><span class="sub">${esc(kind)} · ${esc(hostOf(s.url))}</span></li>`;
  }).join("");

  $("rail").innerHTML = `
    <section class="card">
      <form id="lookup" autocomplete="off">
        <div style="display:flex;flex-direction:column;gap:12px">
          <label class="lbl" for="q">App name or website</label>
          <input class="field" id="q" name="q" type="text" value="${esc(state.query || hostOf(g.provider.website))}" spellcheck="false">
          <button class="btn primary" type="submit">Generate guide</button>
        </div>
      </form>
      <p class="note ${state.message ? "warn" : ""}" id="msg" role="status">${state.message ? esc(state.message) : `Showing the saved guide for <strong>${esc(g.provider.name)}</strong>.`}</p>
    </section>

    <section class="card">
      <h2 class="eyebrow">Library</h2>
      <ul class="lib">${lib}</ul>
    </section>

    <section class="card">
      <h2 class="eyebrow">How far to trust this guide</h2>
      <div class="meter" role="img" aria-label="${claims.length} claims: ${Object.keys(counts).map((k) => counts[k] + " " + LABELS[k]).join(", ")}">${meter}</div>
      <ul class="legend">${legend}</ul>
      <p class="note">${claims.length} claims in total. Open any label to see its source, quote and date.</p>
    </section>

    <section class="card">
      <h2 class="eyebrow">Sources</h2>
      <ul class="list">${srcs}</ul>
    </section>`;
}

/* ---------- guide ---------- */
function renderGuide() {
  const g = DATA[state.key];
  const st = g.setup_types;
  if (st && !st.types.some((t) => t.id === state.type)) state.type = (st.types.find((t) => t.recommended) || st.types[0]).id;
  const sel = st ? state.type : null;

  const head = `
    <section class="card pad-lg head">
      <div class="head-top">
        <div class="row-chips" style="align-items:center;gap:12px"><h1>${esc(g.provider.name)}</h1></div>
        <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap">
          <button class="btn small" type="button" data-copy="1">Copy link</button>
          <span class="note" id="copied" role="status"></span>
        </div>
      </div>
      <p class="lead">${esc(g.summary)}</p>
      <div class="diffs">
        <div class="diff"><span class="eyebrow">Getting started</span>${chipLevel(g.difficulty.start.level)}${fact(g.difficulty.start.reason.text, g.difficulty.start.reason)}</div>
        <div class="diff"><span class="eyebrow">Going public</span>${chipLevel(g.difficulty.public.level)}${fact(g.difficulty.public.reason.text, g.difficulty.public.reason)}</div>
      </div>
      <input class="field" id="copyfallback" type="text" readonly hidden aria-label="Link to copy">
    </section>`;

  const ap = g.time.to_approval;
  const stages = ap.stages.length ? `<ul class="pre">${ap.stages.map((s) => `<li><strong>${esc(s.name)}:</strong> ${esc(s.duration_text)}</li>`).join("")}</ul>` : "";
  const tiles = `
    <section class="tiles" aria-label="Time and effort">
      <div class="tile"><span class="eyebrow">Time to start</span><span class="big">${esc(g.time.to_start.display)}</span>${claimPill(g.time.to_start.claim)}</div>
      <div class="tile"><span class="eyebrow">Wait for approval</span><span class="big">${esc(ap.display)}</span>${stages}${claimPill(ap.claim)}${ap.total_estimate ? `<div class="fact"><span class="t sub">${esc(ap.total_estimate.text)}</span>${claimPill(ap.total_estimate)}</div>` : ""}</div>
      <div class="tile"><span class="eyebrow">Access tiers</span><span class="big">${g.access_ladder.length} ${g.access_ladder.length === 1 ? "tier" : "tiers"}</span><span class="sub">${g.access_ladder.map((t) => esc(t.name)).join(" → ")}</span></div>
    </section>`;

  let setup = "";
  if (st) {
    const tabs = st.types.map((t) => `<button class="tab" role="tab" id="tab-${esc(t.id)}" data-type="${esc(t.id)}" aria-selected="${t.id === sel}">${esc(t.name)}${t.recommended ? ' <span class="chip rec">Recommended</span>' : ""}</button>`).join("");
    const head2 = st.types.map((t) => `<th class="${t.id === sel ? "sel" : ""}" scope="col">${esc(t.name)}<div class="sub" style="font-weight:400">${esc(t.one_line)}</div></th>`).join("");
    const rows = st.rows.map((r) => `<tr><th scope="row">${esc(r.label)}</th>${st.types.map((t) => {
      const cell = r.cells.find((c) => c.type_id === t.id);
      return `<td class="${t.id === sel ? "sel" : ""}">${cell ? fact(cell.value, cell.claim) : "—"}</td>`;
    }).join("")}</tr>`).join("");
    const rec = st.recommendation;
    const recType = st.types.find((t) => t.id === rec.type_id);
    const exc = rec.exceptions.map((e) => {
      const alt = st.types.find((t) => t.id === e.use_instead_type_id);
      return `<li>${fact("If " + e.when.charAt(0).toLowerCase() + e.when.slice(1) + ", use " + (alt ? alt.name : e.use_instead_type_id) + ".", e.claim)}</li>`;
    }).join("");
    setup = section("Step 1 · Pick a setup type", `
      <div class="callout">
        <strong>Recommended: ${esc(recType ? recType.name : rec.type_id)}</strong>
        ${fact(rec.claim.text, rec.claim)}
        ${exc ? `<ul class="list">${exc}</ul>` : ""}
      </div>
      <div class="scroll"><table class="cmp"><thead><tr><th scope="col"></th>${head2}</tr></thead><tbody>${rows}</tbody></table></div>
      <div><p class="eyebrow" style="margin-bottom:8px" id="tablabel">Show the steps for</p><div class="tabs" role="tablist" aria-labelledby="tablabel">${tabs}</div></div>`);
  }

  let paths = "";
  if (g.creation_paths) {
    paths = section("Ways to create the app", `<div class="scroll"><table class="tbl"><thead><tr><th scope="col">Path</th><th scope="col">What you get</th><th scope="col">Use when</th><th scope="col">Evidence</th></tr></thead><tbody>${g.creation_paths.map((p) => `<tr><th scope="row">${esc(p.name)}</th><td>${esc(p.gives)}</td><td>${esc(p.use_when)}</td><td>${fact(p.claim.text, p.claim)}</td></tr>`).join("")}</tbody></table></div>`);
  }

  const ladder = section("Access ladder", `<ol class="ladder">${g.access_ladder.map((t) => `
    <li class="tier"><span class="n">${t.tier}</span><div class="body">
      <h3 style="font-size:16px;font-weight:600">${esc(t.name)}</h3>
      <dl class="kv"><dt>Allows</dt><dd>${esc(t.allows)}</dd><dt>Gate</dt><dd>${esc(t.gate)}</dd></dl>
      ${t.prerequisites.length ? `<div><div class="eyebrow" style="margin-bottom:6px">Before this tier</div><ul class="pre">${t.prerequisites.map((p) => `<li>${esc(p)}</li>`).join("")}</ul></div>` : ""}
      <div class="list">${t.claims.map((c) => fact(c.text, c)).join("")}</div>
    </div></li>`).join("")}</ol>`, "Each tier opens up more users and adds a gate. Registering is only the first one.");

  const steps = g.steps.filter((s) => !s.applies_to || s.applies_to === sel);
  const stepsTitle = st ? `Steps · ${st.types.find((t) => t.id === sel).name}` : "Steps";
  const stepsHtml = steps.length ? `<ol class="steps">${steps.map((s, i) => `<li class="step"><span class="n">${i + 1}</span><div class="body"><span>${esc(s.text)}</span><div class="row-chips"><span class="chip actor ${esc(s.actor)}">${esc(ACTOR[s.actor])}</span></div>${s.claim ? claimPill(s.claim) : ""}</div></li>`).join("")}</ol>`
    : `<p class="note warn">No steps have been researched for this type yet.</p><div class="row-chips">${st ? st.types.filter((t) => g.steps.some((s) => s.applies_to === t.id)).map((t) => `<button class="btn small" type="button" data-type="${esc(t.id)}">Show steps for ${esc(t.name)}</button>`).join("") : ""}</div>`;
  const stepsSec = section(stepsTitle, stepsHtml);

  const reqList = (arr) => arr.length ? `<ul class="list">${arr.map((r) => `<li><div class="rowtop"><strong>${esc(r.item)}</strong><span class="chip status ${esc(r.status)}">${esc(STATUS[r.status])}</span></div>${fact(r.claim.text, r.claim)}</li>`).join("")}</ul>` : `<p class="note">Nothing found.</p>`;
  const reqs = `<section class="two">
    <div class="card pad-lg"><h2 class="h2">To register</h2>${reqList(g.requirements.register)}</div>
    <div class="card pad-lg"><h2 class="h2">To go public</h2>${reqList(g.requirements.go_public)}</div>
  </section>`;

  const limits = section("Limits", `<div class="scroll"><table class="tbl"><thead><tr><th scope="col">Limit</th><th scope="col">Value</th><th scope="col">Evidence</th></tr></thead><tbody>${g.limits.map((l) => `<tr><th scope="row">${esc(l.item)}</th><td>${esc(l.value)}</td><td>${fact(l.claim.text, l.claim)}</td></tr>`).join("")}</tbody></table></div>`);

  const blockers = section("What can trip you up", `<ul class="list">${g.blockers.map((b) => `<li><strong>${esc(b.issue)}</strong><span class="sub">Fix: ${esc(b.fix)}</span>${fact(b.claim.text, b.claim)}</li>`).join("")}</ul>`);

  const taskList = (arr) => `<ul class="list">${arr.map((t) => `<li><strong>${esc(t.text)}</strong>${fact(t.claim.text, t.claim)}</li>`).join("")}</ul>`;
  const split = `<section class="two">
    <div class="card pad-lg"><h2 class="h2">An agent can do</h2>${taskList(g.agent_vs_human.agent)}</div>
    <div class="card pad-lg"><h2 class="h2">You have to do</h2>${taskList(g.agent_vs_human.human)}</div>
  </section>`;

  const extras = (g.extras && g.extras.length) ? section("Also worth knowing", `<ul class="list">${g.extras.map((x) => `<li><strong>${esc(x.title)}</strong><span class="sub">${esc(x.why_it_matters)}</span>${x.claims.map((c) => fact(c.text, c)).join("")}</li>`).join("")}</ul>`) : "";

  const claims = allClaims(g);
  const counts = { tested: 0, official_docs: 0, inferred: 0, unknown: 0 };
  claims.forEach((c) => counts[c.claim.label]++);
  const shown = claims.filter((c) => state.filter === "all" || c.claim.label === state.filter);
  const filters = ["all", "tested", "official_docs", "inferred", "unknown"].map((f) => `<button class="tab" type="button" data-filter="${f}" aria-pressed="${state.filter === f}" ${state.filter === f ? 'style="background:var(--fg);color:var(--bg);border-color:var(--fg)"' : ""}>${f === "all" ? "All" : esc(LABELS[f])} ${f === "all" ? claims.length : counts[f]}</button>`).join("");
  const claimRows = shown.map((c) => `<tr><td>${esc(c.where)}</td><td>${esc(c.claim.text)}</td><td>${claimPill(c.claim)}</td></tr>`).join("");
  const evidence = `
    <section class="card pad-lg dashed">
      <h2 class="h2">Not verified</h2>
      <ul class="list">${g.evidence.not_verified.map((n) => `<li><strong>${esc(n.item)}</strong><span class="sub">${esc(n.note)}</span></li>`).join("")}</ul>
    </section>
    ${g.evidence.conflicts.length ? section("Where sources disagree", `<ul class="list">${g.evidence.conflicts.map((c) => `<li><strong>${esc(c.topic)}</strong><span>A: ${esc(c.a)}</span><span>B: ${esc(c.b)}</span><span class="sub">${esc(c.note)}</span></li>`).join("")}</ul>`) : ""}
    <section class="card pad-lg">
      <h2 class="h2">All claims</h2>
      <div class="filters" role="group" aria-label="Filter claims by label">${filters}</div>
      <div class="scroll"><table class="tbl"><thead><tr><th scope="col">Section</th><th scope="col">Claim</th><th scope="col">Evidence</th></tr></thead><tbody>${claimRows}</tbody></table></div>
    </section>`;

  const foot = `<p class="foot">Generated ${esc(g.generated_at)} · ${g.generated_by.mode === "manual_plus_agent" ? "hands-on testing plus documentation research" : esc(g.generated_by.mode)} · schema ${esc(g.schema_version)}</p>`;

  $("guide").innerHTML = head + tiles + setup + paths + ladder + stepsSec + reqs + limits + blockers + split + extras + evidence + foot;
}

function route() {
  const k = decodeURIComponent(location.hash.slice(1));
  const next = DATA[k] ? k : Object.keys(DATA)[0];
  if (next !== state.key) { state.key = next; state.type = null; state.filter = "all"; state.message = ""; state.query = ""; }
  renderRail();
  renderGuide();
}

document.addEventListener("click", (e) => {
  const tab = e.target.closest("[data-type]");
  if (tab) { state.type = tab.getAttribute("data-type"); renderGuide(); const el = $("tab-" + state.type); if (el) el.focus(); return; }
  const f = e.target.closest("[data-filter]");
  if (f) { state.filter = f.getAttribute("data-filter"); renderGuide(); const el = document.querySelector('[data-filter="' + state.filter + '"]'); if (el) el.focus(); return; }
  if (e.target.closest("[data-copy]")) {
    const fb = $("copyfallback"), out = $("copied");
    const fallback = () => { fb.hidden = false; fb.value = location.href; fb.focus(); fb.select(); out.textContent = "Press copy on the selected link."; };
    try {
      navigator.clipboard.writeText(location.href).then(() => { out.textContent = "Link copied."; }, fallback);
    } catch (err) { fallback(); }
  }
});

document.addEventListener("submit", (e) => {
  if (e.target.id !== "lookup") return;
  e.preventDefault();
  const q = $("q").value.trim().toLowerCase().replace(/^https?:\/\//, "").replace(/^www\./, "").replace(/\/.*$/, "");
  state.query = $("q").value.trim();
  if (!q) return;
  const hit = Object.keys(DATA).find((k) => {
    const d = DATA[k];
    const host = hostOf(d.provider.website).replace(/^www\./, "");
    return k === q || d.provider.name.toLowerCase() === q || host === q || host.split(".")[0] === q.split(".")[0];
  });
  if (hit) { state.message = ""; if (location.hash.slice(1) === hit) route(); else location.hash = hit; return; }
  state.message = "No saved guide for “" + state.query + "”. In the full product, an agent would research it now from the provider's docs and return a guide in this format. This preview only has the saved guides in the library.";
  renderRail();
  $("q").focus();
});

window.addEventListener("hashchange", route);
route();
</script>
